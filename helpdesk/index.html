<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280">
  <title>Helpline</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-brand">
      <span class="topbar-logo">⬡</span>
      <span class="topbar-title">Helpline</span>
    </div>
    <div class="topbar-meta">
      <span class="topbar-count" id="topbar-count"></span>
    </div>
  </header>

  <div class="layout">
    <!-- Ticket list (left pane) -->
    <section class="list-pane" data-ticket-list>
      <div class="list-header">
        <h2>Tickets</h2>
      </div>
      <div class="list-body" id="ticket-list"></div>
    </section>

    <!-- Ticket detail (right pane) -->
    <section class="detail-pane" id="detail-pane">
      <div class="detail-empty" id="detail-empty">
        <p>Select a ticket to view</p>
      </div>
      <div class="detail-content" id="detail-content" style="display:none">
        <div class="detail-header">
          <h2 class="detail-subject" id="detail-subject"></h2>
          <span class="detail-from" id="detail-from"></span>
          <span class="detail-time" id="detail-time"></span>
        </div>
        <div class="detail-body" id="detail-body"></div>
        <div class="detail-images" id="detail-images"></div>
        <div class="detail-actions" data-ticket-actions id="detail-actions"></div>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
